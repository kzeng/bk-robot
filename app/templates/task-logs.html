{% extends "base.html" %}

{% block title %}任务日志{% endblock %}

{% block styles %}
<style>
    .container.mt-4 {
        padding-bottom: 140px;
    }

    .table-container-wrapper {
        position: relative;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .table-container {
        overflow-x: auto;
        overflow-y: visible;
        border-radius: 16px;
        -webkit-overflow-scrolling: touch;
    }

    .table-container::-webkit-scrollbar {
        width: 16px;
        height: 16px;
    }

    .table-container::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
        background: var(--tech-secondary);
        border-radius: 6px;
        border: 3px solid #f1f1f1;
    }

    .table-container table thead th {
        position: sticky;
        top: 0;
        background: var(--tech-secondary);
        color: white;
        z-index: 2;
        padding: 7.5px 6px;
        white-space: nowrap;
    }

    .table td,
    .table th {
        padding: 0.56rem 0.45rem;
        vertical-align: middle;
    }

    #logsTable td,
    #logsTable th {
        padding: 0.56rem 0.45rem;
        line-height: 1.2;
        white-space: nowrap;
    }

    #logsTable .btn-sm {
        padding: 0.25rem 0.5rem;
        line-height: 1.15;
    }

    .table tbody tr {
        transition: all 0.2s ease;
    }

    .table tbody tr:hover {
        background-color: rgba(0,0,0,0.02);
    }

    .pagination-dock {
        position: sticky;
        bottom: 0.75rem;
        z-index: 6;
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .pagination-dock-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
    }

    .pagination-touch {
        margin: 0;
        gap: 0.3rem;
        flex-wrap: wrap;
    }

    .pagination-touch .page-link {
        min-width: 52px;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .pagination-touch .page-item.active .page-link {
        background: var(--tech-secondary);
    }

    .pagination-touch .page-item.disabled .page-link {
        opacity: 0.55;
    }

    .pagination-summary {
        font-size: 0.95rem;
        color: #495057;
        font-weight: 600;
    }

    .empty-state {
        text-align: center;
        color: #6c757d;
        padding: 2rem 1rem;
    }

    @media (max-width: 992px) {
        .pagination-dock-inner {
            flex-direction: column;
            align-items: stretch;
        }

        .pagination-summary {
            text-align: center;
        }
    }
</style>
{% endblock %}

{% block content %}

    <div class="container mt-4">
        <h3 class="mb-4">任务执行日志</h3>
        
        <div class="card">
        
            <div class="card-body">
                <div class="table-container-wrapper">
                    <div class="table-container" id="logTableViewport">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>日志ID</th>
                            <th>任务ID</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>文件数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="logsTable">
                        <!-- Logs will be populated here -->
                    </tbody>
                </table>
                    </div>
                </div>
                
                <div class="pagination-dock">
                    <div class="pagination-dock-inner">
                        <div id="logPaginationSummary" class="pagination-summary">正在准备分页信息...</div>
                        <nav aria-label="Log pagination">
                            <ul class="pagination pagination-touch justify-content-center mb-0" id="logPagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button id="clearLogsBtn" class="btn btn-lg btn-danger">清空日志</button>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Setup clear logs button
        document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);
        // Load logs when page loads
        document.addEventListener('DOMContentLoaded', loadLogs);

        let currentPage = 1;
        const pageSize = 5;
        let totalPages = 1;
        let totalCount = 0;

        function getStatusBadge(status) {
            if (status === 1) {
                return { className: 'bg-warning', text: '进行中' };
            }
            if (status === 2) {
                return { className: 'bg-success', text: '已完成' };
            }
            if (status === 3) {
                return { className: 'bg-primary', text: '部分完成' };
            }
            if (status === 4) {
                return { className: 'bg-danger', text: '失败' };
            }
            return { className: 'bg-secondary', text: '未知' };
        }
        
        function loadLogs() {
            fetch(`/api/task-logs?page=${currentPage}&size=${pageSize}`)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('logsTable');
                    tableBody.innerHTML = '';
                    const pagination = data.pagination || {};
                    currentPage = pagination.page || currentPage;
                    totalPages = pagination.pages || 1;
                    totalCount = pagination.total || 0;
                    if (!data.data || data.data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="7" class="empty-state">没有找到任务日志。</td></tr>';
                        renderLogPagination();
                        return;
                    }
                    
                    data.data.forEach(log => {
                        const row = document.createElement('tr');
                        const statusBadge = getStatusBadge(log.status);
                        row.innerHTML = `
                            <td>${log.log_id}</td>
                            <td>${log.task_id}</td>
                            <td>${log.start_time}</td>
                            <td>${log.end_time}</td>
                            <td>${log.file_count}</td>
                            <td>
                                <h3>
                                <span class="badge rounded-pill ${statusBadge.className}">
                                    ${statusBadge.text}
                                </span>
                                </h3>
                            </td>
                            
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="viewLogDetails(${log.log_id})" title="详情" aria-label="查看日志详情">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                    renderLogPagination();
                });
        }
        
        function renderLogPagination() {
            const ul = document.getElementById('logPagination');
            const summary = document.getElementById('logPaginationSummary');
            ul.innerHTML = '';

            if (totalCount === 0) {
                summary.textContent = '当前没有任务日志数据';
            } else {
                const startIndex = ((currentPage - 1) * pageSize) + 1;
                const endIndex = Math.min(currentPage * pageSize, totalCount);
                summary.textContent = `当前显示第 ${startIndex} - ${endIndex} 条，共 ${totalCount} 条日志`;
            }

            const addPageButton = (label, page, options = {}) => {
                const li = document.createElement('li');
                li.className = 'page-item';
                if (options.active) li.classList.add('active');
                if (options.disabled) li.classList.add('disabled');

                const link = document.createElement('a');
                link.className = 'page-link';
                link.href = '#';
                link.textContent = label;
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    if (options.disabled || options.active || !page) return;
                    currentPage = page;
                    loadLogs();
                });

                li.appendChild(link);
                ul.appendChild(li);
            };

            addPageButton('上一页', currentPage - 1, { disabled: currentPage <= 1 });

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            for (let pageNumber = startPage; pageNumber <= endPage; pageNumber += 1) {
                addPageButton(String(pageNumber), pageNumber, { active: pageNumber === currentPage });
            }

            addPageButton('下一页', currentPage + 1, { disabled: currentPage >= totalPages });
        }

        function viewLogDetails(logId) {
            window.location.href = `/task-logs/${logId}`;
        }
    </script>
{% endblock %}
