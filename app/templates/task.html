<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘点任务管理</title>

    <link href="{{ url_for('static', filename='res/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">视觉盘点机器人</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">控制面板</a>
                <a class="nav-link active" href="/tasks">盘点任务</a>
                <a class="nav-link" href="/task-logs">任务日志</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">盘点任务管理</h1>
        
        <!-- Tasks Table -->
        <div class="mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                创建新任务
            </button>
        </div>

        <!-- Enhanced Task Status Panel -->
        <div class="card mt-4 shadow-sm" id="taskPanel" style="display: none;">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="fas fa-tasks me-2"></i>当前任务状态</h4>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-md-8">
                        <table class="table table-borderless">
                            <tbody>
                                <tr>
                                    <td class="text-muted " style="width: 80px">任务ID</td>
                                    <td><span id="taskId" class="badge bg-dark fs-6">-</span></td>
                                </tr>
                                <tr>
                                    <td class="text-muted ">操作类型</td>
                                    <td><span id="action" class="badge bg-info fs-6">-</span></td>
                                </tr>
                                <tr>
                                    <td class="text-muted ">描述</td>
                                    <td><span id="description" class="fs-5">-</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4 d-flex align-items-center justify-content-center">
                        <div class="text-center">
                            <div class="text-muted  mb-2">当前状态</div>
                            <div id="taskStatus" style="font-size: 3em; font-weight: bold;">
                                <span class="text-muted">准备就绪</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5>任务列表</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标记点</th>
                            <th>操作类型</th>
                            <th>创建时间</th>
                            <th>更新时间</th>
                            <th>描述</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTable">
                        <!-- Tasks will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal fade" id="createTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建新任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="marker" class="form-label">标记点</label>
                            <input type="text" class="form-control" id="marker">
                        </div>
                        <div class="mb-3">
                            <label for="action" class="form-label">操作类型</label>
                            <select class="form-select" id="action">
                                <option value="0">拍照</option>
                                <option value="1">录像</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">描述</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="document.getElementById('taskForm').dispatchEvent(new Event('submit'))">创建</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" id="editTaskId">
                        <div class="mb-3">
                            <label for="editMarker" class="form-label">标记点</label>
                            <input type="text" class="form-control" id="editMarker">
                        </div>
                        <div class="mb-3">
                            <label for="editAction" class="form-label">操作类型</label>
                            <select class="form-select" id="editAction">
                                <option value="0">拍照</option>
                                <option value="1">录像</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editDescription" class="form-label">描述</label>
                            <textarea class="form-control" id="editDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveTaskBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Bootstrap JS -->
    <script src="{{ url_for('static', filename='res/bootstrap.bundle.min.js') }}"></script>
    
    
    <!-- Include main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Load tasks when page loads
        document.addEventListener('DOMContentLoaded', loadTasks);

        // Form submission for new task
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            createTask();
        });

        // Save edited task
        document.getElementById('saveTaskBtn').addEventListener('click', saveTask);

        function loadTasks() {
            fetch('/api/tasks')
                .then(response => response.json())
                .then(tasks => {
                    const tableBody = document.getElementById('tasksTable');
                    tableBody.innerHTML = '';
                    
                    tasks.forEach(task => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${task.task_id}</td>
                            <td>${task.marker}</td>
                            <td>${getActionText(task.action)}</td>
                            <td>${task.create_at}</td>
                            <td>${task.update_at || '-'}</td>
                            <td>${task.description}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="editTask(${task.task_id})">编辑</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.task_id})">删除</button>

                                <button class="btn btn-sm btn-success" onclick="runTask(${task.task_id})">执行</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
        }

        function getActionText(action) {
            return action === 0 ? '拍照' : '录像';
        }


        function createTask() {
            const taskData = {
                marker: document.getElementById('marker').value,
                action: parseInt(document.getElementById('action').value),
                description: document.getElementById('description').value
            };

            fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(taskData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'OK') {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createTaskModal'));
                    modal.hide();
                    loadTasks();
                    document.getElementById('taskForm').reset();
                }
            });
        }

        function editTask(taskId) {
            fetch(`/api/tasks/${taskId}`)
                .then(response => response.json())
                .then(task => {
                    document.getElementById('editTaskId').value = taskId;
                    document.getElementById('editMarker').value = task.marker;
                    document.getElementById('editAction').value = task.action;
                    document.getElementById('editDescription').value = task.description;
                    
                    const modal = new bootstrap.Modal(document.getElementById('editTaskModal'));
                    modal.show();
                });
        }

        function saveTask() {
            const taskId = document.getElementById('editTaskId').value;
            const taskData = {
                marker: document.getElementById('editMarker').value,
                action: parseInt(document.getElementById('editAction').value),
                description: document.getElementById('editDescription').value
            };

            fetch(`/api/tasks/${taskId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(taskData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'OK') {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editTaskModal'));
                    modal.hide();
                    loadTasks();
                }
            });
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？')) {
                fetch(`/api/tasks/${taskId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'OK') {
                        loadTasks();
                    }
                });
            }
        }
    </script>
</body>
</html>
