<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘点任务管理</title>
    <!--
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">机器人控制</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">控制面板</a>
                <a class="nav-link" href="/tasks">盘点任务</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">盘点任务管理</h1>
        
        <!-- Task Creation Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>创建新任务</h5>
            </div>
            <div class="card-body">
                <form id="taskForm">
                    <div class="mb-3">
                        <label for="marker" class="form-label">标记点</label>
                        <input type="text" class="form-control" id="marker">
                    </div>
                    <div class="mb-3">
                        <label for="action" class="form-label">操作类型</label>
                        <select class="form-select" id="action">
                            <option value="0">拍照</option>
                            <option value="1">录像</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">描述</label>
                        <textarea class="form-control" id="description" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">创建任务</button>
                </form>
            </div>
        </div>

        <!-- Tasks Table -->
        <div class="card">
            <div class="card-header">
                <h5>任务列表</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标记点</th>
                            <th>操作类型</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>更新时间</th>
                            <th>运行时间</th>
                            <th>描述</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTable">
                        <!-- Tasks will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" id="editTaskId">
                        <div class="mb-3">
                            <label for="editMarker" class="form-label">标记点</label>
                            <input type="text" class="form-control" id="editMarker">
                        </div>
                        <div class="mb-3">
                            <label for="editAction" class="form-label">操作类型</label>
                            <select class="form-select" id="editAction">
                                <option value="0">拍照</option>
                                <option value="1">录像</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editStatus" class="form-label">状态</label>
                            <select class="form-select" id="editStatus">
                                <option value="0">待处理</option>
                                <option value="1">运行中</option>
                                <option value="2">失败</option>
                                <option value="3">已完成</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editDescription" class="form-label">描述</label>
                            <textarea class="form-control" id="editDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveTaskBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load tasks when page loads
        document.addEventListener('DOMContentLoaded', loadTasks);

        // Form submission for new task
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            createTask();
        });

        // Save edited task
        document.getElementById('saveTaskBtn').addEventListener('click', saveTask);

        function loadTasks() {
            fetch('/api/tasks')
                .then(response => response.json())
                .then(tasks => {
                    const tableBody = document.getElementById('tasksTable');
                    tableBody.innerHTML = '';
                    
                    tasks.forEach(task => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${task.task_id}</td>
                            <td>${task.marker}</td>
                            <td>${getActionText(task.action)}</td>
                            <td>${getStatusText(task.status)}</td>
                            <td>${task.create_at}</td>
                            <td>${task.update_at || '-'}</td>
                            <td>${task.run_at || '-'}</td>
                            <td>${task.description}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="editTask(${task.task_id})">编辑</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.task_id})">删除</button>

                                <button class="btn btn-sm btn-success" onclick="runTask(${task.task_id})">执行</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
        }

        function getActionText(action) {
            return action === 0 ? '拍照' : '录像';
        }

        function getStatusText(status) {
            const statusMap = {
                0: '待处理',
                1: '运行中', 
                2: '失败',
                3: '已完成'
            };
            return statusMap[status] || '未知';
        }

        function createTask() {
            const taskData = {
                marker: document.getElementById('marker').value,
                action: parseInt(document.getElementById('action').value),
                description: document.getElementById('description').value
            };

            fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(taskData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'OK') {
                    loadTasks();
                    document.getElementById('taskForm').reset();
                }
            });
        }

        function editTask(taskId) {
            fetch(`/api/tasks/${taskId}`)
                .then(response => response.json())
                .then(task => {
                    document.getElementById('editTaskId').value = taskId;
                    document.getElementById('editMarker').value = task.marker;
                    document.getElementById('editAction').value = task.action;
                    document.getElementById('editStatus').value = task.status;
                    document.getElementById('editDescription').value = task.description;
                    
                    const modal = new bootstrap.Modal(document.getElementById('editTaskModal'));
                    modal.show();
                });
        }

        function saveTask() {
            const taskId = document.getElementById('editTaskId').value;
            const taskData = {
                marker: document.getElementById('editMarker').value,
                action: parseInt(document.getElementById('editAction').value),
                status: parseInt(document.getElementById('editStatus').value),
                description: document.getElementById('editDescription').value
            };

            fetch(`/api/tasks/${taskId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(taskData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'OK') {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editTaskModal'));
                    modal.hide();
                    loadTasks();
                }
            });
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？')) {
                fetch(`/api/tasks/${taskId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'OK') {
                        loadTasks();
                    }
                });
            }
        }
    </script>
</body>
</html>
