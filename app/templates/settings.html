{% extends "base.html" %}

{% block content %}
<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<div class="container mt-4">
    <h3 class="mb-4">系统设置</h3>
    <div class="card">
        <div class="card-body">
            <form id="settingsForm">
                <div class="row">
                    <!-- 左侧板块 -->
                    <div class="col-md-6">
                        <!-- 摄像头配置 -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2"><i class="fas fa-camera me-2"></i>摄像头配置</h5>
                            <!-- Basic Parameters -->
                            <div class="mb-3">
                                <label class="form-label">分辨率-宽度</label>
                                <input type="number" class="form-control" name="CAMERA_WIDTH" value="{{ env.CAMERA_WIDTH }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">分辨率-高度</label>
                                <input type="number" class="form-control" name="CAMERA_HEIGHT" value="{{ env.CAMERA_HEIGHT }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">帧率(FPS)</label>
                                <input type="number" class="form-control" name="CAMERA_FPS" value="{{ env.CAMERA_FPS }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">JPEG质量(1-100)</label>
                                <input type="number" class="form-control" name="CAMERA_JPEG_QUALITY" min="1" max="100" value="{{ env.CAMERA_JPEG_QUALITY }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">缓冲区大小</label>
                                <input type="number" class="form-control" name="CAMERA_BUFFER_SIZE" value="{{ env.CAMERA_BUFFER_SIZE }}" required>
                            </div>
                            
                            <!-- Advanced Camera Parameters -->
                            <h6 class="mt-4 mb-3">高级相机参数</h6>
                            
                            <!-- Image Parameters -->
                            <div class="card mb-3">
                                <div class="card-header">图像参数</div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">亮度</label>
                                            <input type="number" class="form-control" name="CAMERA_BRIGHTNESS" value="{{ env.CAMERA_BRIGHTNESS }}" min="0" max="255">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">对比度</label>
                                            <input type="number" class="form-control" name="CAMERA_CONTRAST" value="{{ env.CAMERA_CONTRAST }}" min="0" max="255">
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-6">
                                            <label class="form-label">饱和度</label>
                                            <input type="number" class="form-control" name="CAMERA_SATURATION" value="{{ env.CAMERA_SATURATION }}" min="0" max="255">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">锐度</label>
                                            <input type="number" class="form-control" name="CAMERA_SHARPNESS" value="{{ env.CAMERA_SHARPNESS }}" min="0" max="100">
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-6">
                                            <label class="form-label">伽马值</label>
                                            <input type="number" class="form-control" name="CAMERA_GAMMA" value="{{ env.CAMERA_GAMMA }}" min="0" max="500">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Exposure Parameters -->
                            <div class="card mb-3">
                                <div class="card-header">曝光参数</div>
                                <div class="card-body">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" name="CAMERA_AUTO_EXPOSURE" value="1" 
                                               {% if env.CAMERA_AUTO_EXPOSURE == '1' %}checked{% endif %}>
                                        <label class="form-check-label">自动曝光</label>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">曝光时间</label>
                                            <input type="number" class="form-control" name="CAMERA_EXPOSURE_TIME" value="{{ env.CAMERA_EXPOSURE_TIME }}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">增益</label>
                                            <input type="number" class="form-control" name="CAMERA_GAIN" value="{{ env.CAMERA_GAIN }}">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- White Balance Parameters -->
                            <div class="card mb-3">
                                <div class="card-header">白平衡参数</div>
                                <div class="card-body">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" name="CAMERA_WB_AUTO" value="1"
                                               {% if env.CAMERA_WB_AUTO == '1' %}checked{% endif %}>
                                        <label class="form-check-label">自动白平衡</label>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">色温</label>
                                            <input type="number" class="form-control" name="CAMERA_WB_TEMP" value="{{ env.CAMERA_WB_TEMP }}">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Other Parameters -->
                            <div class="card mb-3">
                                <div class="card-header">其他参数</div>
                                <div class="card-body">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" name="CAMERA_FOCUS_AUTO" value="1"
                                               {% if env.CAMERA_FOCUS_AUTO == '1' %}checked{% endif %}>
                                        <label class="form-check-label">自动对焦</label>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">焦距</label>
                                            <input type="number" class="form-control" name="CAMERA_FOCUS" value="{{ env.CAMERA_FOCUS }}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">背光补偿</label>
                                            <input type="number" class="form-control" name="CAMERA_BACKLIGHT" value="{{ env.CAMERA_BACKLIGHT }}" min="0" max="1">
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-6">
                                            <label class="form-label">电源频率</label>
                                            <select class="form-select" name="CAMERA_POWERLINE_FREQ">
                                                <option value="1" {% if env.CAMERA_POWERLINE_FREQ == '1' %}selected{% endif %}>50Hz</option>
                                                <option value="2" {% if env.CAMERA_POWERLINE_FREQ == '2' %}selected{% endif %}>60Hz</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
           
                    </div>
                    <!-- 右侧板块 -->
                    <div class="col-md-6">
                        <!-- 机器人配置 -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2"><i class="fas fa-robot me-2"></i>机器人配置</h5>
                            <div class="mb-3">
                                <label class="form-label">机器人IP</label>
                                <input type="text" class="form-control" name="ROBOT_IP" value="{{ env.ROBOT_IP }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">机器人端口</label>
                                <input type="number" class="form-control" name="ROBOT_PORT" value="{{ env.ROBOT_PORT }}" required>
                            </div>
                            <div class="mb-3">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" name="ROBOT_MOCK_MODE" {% if env.ROBOT_MOCK_MODE in ['1', 'true', 'True', 1, True] %}checked{% endif %}>
                                    <label class="form-check-label">模拟模式</label>
                                </div>
                            </div>
                        </div>
                        <!-- FTP配置 -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2"><i class="fas fa-server me-2"></i>FTP配置</h5>
                            <div class="mb-3">
                                <label class="form-label">FTP服务器</label>
                                <input type="text" class="form-control" name="FTP_HOST" value="{{ env.FTP_HOST }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">FTP端口</label>
                                <input type="number" class="form-control" name="FTP_PORT" value="{{ env.FTP_PORT }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">FTP用户名</label>
                                <input type="text" class="form-control" name="FTP_USER" value="{{ env.FTP_USER }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">FTP密码</label>
                                <input type="password" class="form-control" name="FTP_PASS" value="{{ env.FTP_PASS }}" required>
                            </div>
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="FTP_MOCK_MODE" {% if env.FTP_MOCK_MODE in ['1', 'true', 'True', 1, True] %}checked{% endif %}>
                                    <label class="form-check-label">FTP模拟模式</label>
                                </div>
                            </div>
                        </div>
                        <!-- 升降柱配置 -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2"><i class="fas fa-arrow-up me-2"></i>升降柱配置</h5>
                            <div class="mb-3">
                                <label class="form-label">串口号</label>
                                <input type="text" class="form-control" name="LIFT_PORT" value="{{ env.LIFT_PORT }}" required>
                            </div>
                        </div>


                        <!-- OBS配置 -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2"><i class="fas fa-video me-2"></i>OBS配置</h5>
                            <div class="mb-3">
                                <label class="form-label">WebSocket URL</label>
                                <input type="text" class="form-control" name="OBS_WS_URL" value="{{ env.OBS_WS_URL }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" class="form-control" name="OBS_PASSWORD" value="{{ env.OBS_PASSWORD }}" required>
                            </div>
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="USE_OPENCV" {% if env.USE_OPENCV in ['1', 'true', 'True', 1, True] %}checked{% endif %}>
                                    <label class="form-check-label">使用OpenCV模式(否则使用OBS)</label><br>
                                    <small class="form-text text-muted ms-2">
                                        注意： 只有OpenCV模式启用时，高级相机参数设置才有效。
                                    </small>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>保存设置
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.reload()">
                        <i class="fas fa-undo me-2"></i>重置
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('settingsForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const settings = {};
    // 处理所有复选框字段，包括高级相机参数
    const checkboxFields = [
        'ROBOT_MOCK_MODE', 'USE_OPENCV', 'FTP_MOCK_MODE',
        'CAMERA_AUTO_EXPOSURE', 'CAMERA_WB_AUTO', 'CAMERA_FOCUS_AUTO'
    ];
    for (let field of checkboxFields) {
        settings[field] = formData.has(field) ? '1' : '0';
    }
    for (let [key, value] of formData.entries()) {
        if (!checkboxFields.includes(key)) {
            settings[key] = value;
        }
    }
    // 保存按钮处理
    const saveBtn = document.querySelector('button[type="submit"]');
    const originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>保存中...';
    try {
        const response = await fetch('/api/settings', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(settings)
        });
        const result = await response.json();
        if (response.ok) {
            // 创建并显示成功消息 toast
            const container = document.getElementById('toastContainer');
            container.innerHTML = `
                <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-success text-white">
                        <i class="fas fa-check-circle me-2"></i>
                        <strong class="me-auto">成功</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">
                        设置已保存，部分设置可能需要重启服务才能生效
                    </div>
                </div>
            `;
            const toastElement = container.querySelector('.toast');
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
        } else {
            throw new Error(result.message || '保存失败');
        }
    } catch (error) {
        // 显示错误消息 toast
        const container = document.getElementById('toastContainer');
        container.innerHTML = `
            <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-danger text-white">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <strong class="me-auto">错误</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">
                    保存设置时出错: ${error.message}
                </div>
            </div>
        `;
        const toastElement = container.querySelector('.toast');
        const toast = new bootstrap.Toast(toastElement);
        toast.show();
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
    }
});
</script>
{% endblock %}
